[package]
name = "wash"
version = "0.2.1"
edition = "2021"
description = "A Rust reimplementation of bash with fish-like interactive UX, aiming for 100% bash command & syntax compatibility"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
# Display-width math for correct cursor positioning with multi-byte (CJK,
# emoji) characters in the hand-rolled termios/ANSI line editor (repl.rs).
# Kept minimal: no line-editor/TUI framework, no Win32 backend.
unicode-width = "0.1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
