name: Build

# Build gate for wash.
#
# IRON RULE: the toolchain is MSYS2 with MSYSTEM=MSYS ONLY. mingw64 / ucrt64 and
# the mingw-w64-* MSYS2 packages are FORBIDDEN (see project memory). wash links
# against the MSYS / Cygwin runtime (msys-2.0.dll): its C shim (src/posix_shim.c)
# MUST be compiled by the *msys* gcc (targets x86_64-pc-cygwin, links
# msys-2.0.dll), never the MinGW-w64 gcc.
#
# Use the MSYS2 `rust` package (msys/rust, host x86_64-pc-cygwin), NOT rustup
# and NOT any mingw-w64 rust package. With that package `rustc --print sysroot`
# is /usr, so the gcc that build.rs probes (<sysroot>/bin/gcc.exe) is exactly
# /usr/bin/gcc.exe -- the MSYS gcc, which finds its cc1 under /usr/lib/gcc/...
# and links msys-2.0.dll. Crucially we do NOT copy/symlink gcc anywhere: a
# relocated gcc infers its exec prefix from argv[0] (no longer /usr) and then
# fails with "cannot execute 'cc1': spawn: No such file or directory".
#
# The full semantic test suite (tests/bash_diff_*.sh) needs the local MSYS2
# bash 5.3.20 oracle and is run locally / on the WSL second oracle, NOT here.
# This workflow only proves the tree compiles on the mandated toolchain.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (MSYS2 / MSYS, no MinGW)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MSYS subsystem, NO mingw64/ucrt64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            rust
            gcc
            bash
            git
            curl

      - name: Verify MSYS-only toolchain (hard gates)
        run: |
          echo "MSYSTEM=$MSYSTEM"
          test "$MSYSTEM" = MSYS || { echo "FATAL: MSYSTEM must be MSYS" >&2; exit 1; }
          command -v rustc
          command -v cargo
          rustc -vV
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          echo "rustc host=$HOST"
          case "$HOST" in
            x86_64-pc-cygwin) ;;
            *) echo "FATAL: rustc host is not the MSYS/Cygwin target" >&2; exit 1 ;;
          esac
          SYSROOT="$(rustc --print sysroot)"
          echo "rustc sysroot=$SYSROOT"
          # build.rs hard gate: this exact path must exist and be the MSYS gcc.
          test -x "$SYSROOT/bin/gcc.exe" || { echo "FATAL: no gcc at sysroot" >&2; exit 1; }
          echo "gcc version: $("$SYSROOT/bin/gcc.exe" --version | head -1)"
          MACHINE="$("$SYSROOT/bin/gcc.exe" -dumpmachine)"
          echo "gcc target=$MACHINE"
          case "$MACHINE" in
            *-cygwin*) ;;
            *) echo "FATAL: gcc is not the MSYS/Cygwin gcc" >&2; exit 1 ;;
          esac
          # Belt-and-suspenders: build.rs must never resolve a bare `bash` to
          # the WSL launcher stub on windows-latest. Pass the exact MSYS bash.
          echo "WASH_BASH=$(cygpath -m /usr/bin/bash.exe)" >> "$GITHUB_ENV"

      - name: Build (debug)
        run: cargo build --verbose

      - name: Smoke test (debug binary)
        run: |
          test -s target/debug/wash.exe || { echo "FATAL: no debug binary" >&2; exit 1; }
          OUT="$(./target/debug/wash.exe --version)"
          echo "wash --version: $OUT"
          test -n "$OUT" || { echo "FATAL: empty --version output" >&2; exit 1; }

      - name: Upload artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: wash-debug
          path: target/debug/wash.exe
          if-no-files-found: error

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Upload artifact (release)
        uses: actions/upload-artifact@v4
        with:
          name: wash-release
          path: target/release/wash.exe
          if-no-files-found: error
