name: Build

# Build gate for wash.
#
# IRON RULE: the toolchain is MSYS2 with MSYSTEM=MSYS ONLY. mingw64 / ucrt64 and
# the mingw-w64-* MSYS2 packages are FORBIDDEN (see project memory). wash links
# against the MSYS / Cygwin runtime (msys-2.0.dll): its C shim (src/posix_shim.c)
# MUST be compiled by the *msys* gcc (targets x86_64-pc-cygwin, links
# msys-2.0.dll), never the MinGW-w64 gcc.
#
# build.rs probes `<rustc --print sysroot>/bin/gcc.exe` and refuses to fall back
# to whatever gcc is first on PATH, so we point that exact path at the MSYS gcc.
# Rust itself is installed via rustup (NOT a mingw64 MSYS2 package); the bundled
# MinGW gcc that rustup ships for the gnu target is replaced by the MSYS gcc so
# the shim — and the final link — use msys-2.0.dll.
#
# NOTE: rustup is a Windows binary, so it installs into %USERPROFILE%\.cargo
# (e.g. C:\Users\runneradmin\.cargo). The MSYS2 shell's $HOME is /home/runneradmin,
# so `$HOME/.cargo/env` does NOT exist there. We therefore expose the real cargo
# bin via cygpath + $GITHUB_PATH instead of sourcing that env file.
#
# The full semantic test suite (tests/bash_diff_*.sh) needs the local MSYS2
# bash 5.3.20 oracle at /d/msys2/usr/bin/bash.exe and is run locally / on the
# WSL second oracle, NOT here. This workflow only proves the tree compiles.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (MSYS2 / MSYS, no MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MSYS subsystem, NO mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            gcc
            bash
            git
            curl

      - name: Install Rust via rustup (gnu target)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable-x86_64-pc-windows-gnu --profile minimal --no-modify-path
          # rustup is a Windows binary: it installs into %USERPROFILE%\.cargo,
          # but the MSYS2 shell $HOME is /home/runneradmin, so $HOME/.cargo/env
          # is absent. Expose the real cargo bin on PATH for this + later steps.
          CARGO_BIN="$(cygpath "$USERPROFILE")/.cargo/bin"
          echo "CARGO_BIN=$CARGO_BIN"
          export PATH="$CARGO_BIN:$PATH"
          echo "$CARGO_BIN" >> "$GITHUB_PATH"
          cargo --version
          rustc --version

      - name: Bind build.rs to the MSYS gcc (not MinGW)
        run: |
          SYSROOT="$(rustc --print sysroot)"
          SYSROOT_U="$(cygpath -u "$SYSROOT")"
          # build.rs probes <sysroot>/bin/gcc.exe and MUST compile the shim with
          # the *msys* gcc. Replace rustup's bundled MinGW gcc with the MSYS one.
          cp -f /usr/bin/gcc.exe "$SYSROOT_U/bin/gcc.exe"
          "$SYSROOT_U/bin/gcc.exe" --version

      - name: Build (debug)
        run: cargo build --verbose

      - name: Upload artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: wash-debug
          path: target/debug/wash.exe
          if-no-files-found: error

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Upload artifact (release)
        uses: actions/upload-artifact@v4
        with:
          name: wash-release
          path: target/release/wash.exe
          if-no-files-found: error
