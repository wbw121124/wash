name: Build and Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # Linux x86_64 构建
  build-linux-x86_64:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libreadline-dev gettext
        
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Run tests
      run: |
        cd build
        ./wash_test || true
        ./wash_test3 || true
    
    - name: Install
      run: |
        cd build
        sudo make install DESTDIR=${{ github.workspace }}/install
    
    - name: Create package
      run: |
        cd ${{ github.workspace }}/install
        tar -czf ../wash-linux-x86_64.tar.gz .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-linux-x86_64
        path: wash-linux-x86_64.tar.gz

  # MSYS2 (MinGW64) 构建
  build-msys2-mingw64:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-readline
          mingw-w64-x86_64-gettext
          make
    
    - name: Configure CMake
      run: |
        WORKSPACE=$(cygpath -u "${{ github.workspace }}")
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/mingw64 \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Copy MSYS2 runtime DLLs
      run: |
        cd build
        mkdir -p dist
        cp wash.exe wash_test.exe wash_test3.exe dist/
        for dll in libintl-8.dll libiconv-2.dll libreadline8.dll libhistory8.dll \
                   libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
          cp "/mingw64/bin/$dll" dist/ 2>/dev/null || true
        done
    
    - name: Run tests
      run: |
        cd build
        ./wash_test || true
        ./wash_test3 || true
    
    - name: Install
      run: |
        cd build
        make install DESTDIR=$(cygpath -u "${{ github.workspace }}/install")
    
    - name: Create package
      run: |
        WORKSPACE=$(cygpath -u "${{ github.workspace }}")
        cd "$WORKSPACE/install"
        7z a -tzip "$WORKSPACE/wash-mingw-x86_64.zip" .
        cd "$WORKSPACE/build/dist"
        7z a -tzip "$WORKSPACE/wash-mingw-x86_64-dlls.zip" *.exe *.dll
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-mingw-x86_64
        path: wash-mingw-x86_64.zip
    
    - name: Upload DLLs
      uses: actions/upload-artifact@v4
      with:
        name: wash-mingw-x86_64-dlls
        path: wash-mingw-x86_64-dlls.zip

  # MSYS2 (MinGW32) 构建
  build-msys2-mingw32:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        update: true
        install: >-
          mingw-w64-i686-gcc
          mingw-w64-i686-cmake
          mingw-w64-i686-readline
          mingw-w64-i686-gettext
          make
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/mingw32 \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Copy MSYS2 runtime DLLs
      run: |
        cd build
        mkdir -p dist
        cp wash.exe wash_test.exe wash_test3.exe dist/
        for dll in libintl-8.dll libiconv-2.dll libreadline8.dll libhistory8.dll \
                   libgcc_s_sjlj-1.dll libstdc++-6.dll libwinpthread-1.dll; do
          cp "/mingw32/bin/$dll" dist/ 2>/dev/null || true
        done
    
    - name: Run tests
      run: |
        cd build
        ./wash_test.exe || true
        ./wash_test3.exe || true
    
    - name: Install
      run: |
        cd build
        make install DESTDIR=$(cygpath -u "${{ github.workspace }}/install")
    
    - name: Create package
      run: |
        WORKSPACE=$(cygpath -u "${{ github.workspace }}")
        cd "$WORKSPACE/install"
        7z a -tzip "$WORKSPACE/wash-mingw-i686.zip" .
        cd "$WORKSPACE/build/dist"
        7z a -tzip "$WORKSPACE/wash-mingw-i686-dlls.zip" *.exe *.dll
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-mingw-i686
        path: wash-mingw-i686.zip
    
    - name: Upload DLLs
      uses: actions/upload-artifact@v4
      with:
        name: wash-mingw-i686-dlls
        path: wash-mingw-i686-dlls.zip

  # MSYS2 (UCRT64) 构建
  build-msys2-ucrt64:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-readline
          mingw-w64-ucrt-x86_64-gettext
          make
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/ucrt64 \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Copy MSYS2 runtime DLLs
      run: |
        cd build
        mkdir -p dist
        cp wash.exe wash_test.exe wash_test3.exe dist/
        for dll in libintl-8.dll libiconv-2.dll libreadline8.dll libhistory8.dll \
                   libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
          cp "/ucrt64/bin/$dll" dist/ 2>/dev/null || true
        done
    
    - name: Run tests
      run: |
        cd build
        ./wash_test.exe || true
        ./wash_test3.exe || true
    
    - name: Install
      run: |
        cd build
        make install DESTDIR=$(cygpath -u "${{ github.workspace }}/install")
    
    - name: Create package
      run: |
        WORKSPACE=$(cygpath -u "${{ github.workspace }}")
        cd "$WORKSPACE/install"
        7z a -tzip "$WORKSPACE/wash-ucrt-x86_64.zip" .
        cd "$WORKSPACE/build/dist"
        7z a -tzip "$WORKSPACE/wash-ucrt-x86_64-dlls.zip" *.exe *.dll
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-ucrt-x86_64
        path: wash-ucrt-x86_64.zip
    
    - name: Upload DLLs
      uses: actions/upload-artifact@v4
      with:
        name: wash-ucrt-x86_64-dlls
        path: wash-ucrt-x86_64-dlls.zip

  # 发布 Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-x86_64, build-msys2-mingw64, build-msys2-mingw32, build-msys2-ucrt64]
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/wash-linux-x86_64/*
          artifacts/wash-mingw-x86_64/*
          artifacts/wash-mingw-i686/*
          artifacts/wash-ucrt-x86_64/*
        generate_release_notes: true
        draft: false
        prerelease: false
