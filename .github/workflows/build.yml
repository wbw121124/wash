name: Build and Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # Linux x86_64 构建
  build-linux-x86_64:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libreadline-dev gettext libncurses-dev
        
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Run tests
      run: |
        cd build
        ./wash_test || true
        ./wash_test3 || true
    
    - name: Install
      run: |
        cd build
        sudo make install DESTDIR=${{ github.workspace }}/install
    
    - name: Create package
      run: |
        cd ${{ github.workspace }}/install
        tar -czf ../wash-linux-x86_64.tar.gz .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-linux-x86_64
        path: wash-linux-x86_64.tar.gz

  # Linux aarch64 交叉编译
  build-linux-aarch64:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          libreadline-dev gettext libncurses-dev
        
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc) wash
    
    - name: Install
      run: |
        cd build
        sudo make install DESTDIR=${{ github.workspace }}/install
    
    - name: Create package
      run: |
        cd ${{ github.workspace }}/install
        tar -czf ../wash-linux-aarch64.tar.gz .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-linux-aarch64
        path: wash-linux-aarch64.tar.gz

  # Linux armv7l 交叉编译
  build-linux-armv7l:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake \
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
          libreadline-dev gettext libncurses-dev
        
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=armv7l \
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
          -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
          -DCMAKE_FIND_ROOT_PATH=/usr/arm-linux-gnueabihf \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc) wash
    
    - name: Install
      run: |
        cd build
        sudo make install DESTDIR=${{ github.workspace }}/install
    
    - name: Create package
      run: |
        cd ${{ github.workspace }}/install
        tar -czf ../wash-linux-armv7l.tar.gz .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-linux-armv7l
        path: wash-linux-armv7l.tar.gz
  build-msys2-mingw64:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-readline
          mingw-w64-x86_64-ncurses
          mingw-w64-x86_64-gettext
          make
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/mingw64 \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Run tests
      run: |
        cd build
        ./wash_test.exe || true
        ./wash_test3.exe || true
    
    - name: Install
      run: |
        cd build
        make install DESTDIR=${{ github.workspace }}/install
    
    - name: Create package
      run: |
        cd ${{ github.workspace }}/install
        7z a -tzip ../wash-mingw-x86_64.zip .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-mingw-x86_64
        path: wash-mingw-x86_64.zip

  # MSYS2 (MinGW32) 构建
  build-msys2-mingw32:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        update: true
        install: >-
          mingw-w64-i686-gcc
          mingw-w64-i686-cmake
          mingw-w64-i686-readline
          mingw-w64-i686-ncurses
          mingw-w64-i686-gettext
          make
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/mingw32 \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Run tests
      run: |
        cd build
        ./wash_test.exe || true
        ./wash_test3.exe || true
    
    - name: Install
      run: |
        cd build
        make install DESTDIR=${{ github.workspace }}/install
    
    - name: Create package
      run: |
        cd ${{ github.workspace }}/install
        7z a -tzip ../wash-mingw-i686.zip .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-mingw-i686
        path: wash-mingw-i686.zip

  # MSYS2 (UCRT64) 构建
  build-msys2-ucrt64:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-readline
          mingw-w64-ucrt-x86_64-ncurses
          mingw-w64-ucrt-x86_64-gettext
          make
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/ucrt64 \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Run tests
      run: |
        cd build
        ./wash_test.exe || true
        ./wash_test3.exe || true
    
    - name: Install
      run: |
        cd build
        make install DESTDIR=${{ github.workspace }}/install
    
    - name: Create package
      run: |
        cd ${{ github.workspace }}/install
        7z a -tzip ../wash-ucrt-x86_64.zip .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-ucrt-x86_64
        path: wash-ucrt-x86_64.zip

  # 发布 Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-x86_64, build-linux-aarch64, build-linux-armv7l, build-msys2-mingw64, build-msys2-mingw32, build-msys2-ucrt64]
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/wash-linux-x86_64/*
          artifacts/wash-linux-aarch64/*
          artifacts/wash-linux-armv7l/*
          artifacts/wash-mingw-x86_64/*
          artifacts/wash-mingw-i686/*
          artifacts/wash-ucrt-x86_64/*
        generate_release_notes: true
        draft: false
        prerelease: false
