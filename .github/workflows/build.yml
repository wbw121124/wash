name: Build and Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # Linux x86_64 构建
  build-linux-x86_64:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libreadline-dev gettext
        
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Run tests
      run: |
        cd build
        ./wash_test || true
        ./wash_test3 || true
    
    - name: Install
      run: |
        cd build
        sudo make install DESTDIR=${{ github.workspace }}/install
    
    - name: Create package
      run: |
        cd ${{ github.workspace }}/install
        tar -czf ../wash-linux-x86_64.tar.gz .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-linux-x86_64
        path: wash-linux-x86_64.tar.gz

    - name: Package source code (wash + readline)
      run: |
        sudo apt-get install -y xz-utils >/dev/null 2>&1
        READLINE_VER=$(pkg-config --modversion readline 2>/dev/null | cut -d. -f1-2)
        [ -n "$READLINE_VER" ] || READLINE_VER=8.2
        WORK=/tmp/wash-src-pkg
        rm -rf "$WORK"
        mkdir -p "$WORK/readline" "$WORK/wash"
        curl -fsSL -o "$WORK/readline.tar.gz" "https://ftp.gnu.org/gnu/readline/readline-${READLINE_VER}.tar.gz" \
          || curl -fsSL -o "$WORK/readline.tar.gz" "https://ftp.gnu.org/gnu/readline/readline-8.2.tar.gz"
        tar -xzf "$WORK/readline.tar.gz" -C "$WORK/readline" --strip-components=1
        rm -f "$WORK/readline.tar.gz"
        cp -a ${{ github.workspace }}/. "$WORK/wash/"
        rm -rf "$WORK/wash/build" "$WORK/wash/.git"
        tar -cJf ${{ github.workspace }}/wash-linux-x86_64-code.tar.xz -C "$WORK" .

    - name: Upload source code artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-linux-x86_64-code
        path: wash-linux-x86_64-code.tar.xz

  # MSYS2 (MinGW64) 构建
  build-msys2-mingw64:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-readline
          mingw-w64-x86_64-gettext
          make
    
    - name: Configure CMake
      run: |
        WORKSPACE=$(cygpath -u "${{ github.workspace }}")
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/mingw64 \
          ..
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Copy MSYS2 runtime DLLs
      run: |
        cd build
        mkdir -p dist
        cp wash.exe wash_test.exe wash_test3.exe dist/
        for dll in libintl-8.dll libiconv-2.dll libreadline8.dll libhistory8.dll \
                   libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
          cp "/mingw64/bin/$dll" dist/ 2>/dev/null || true
        done
    
    - name: Run tests
      run: |
        cd build
        ./wash_test || true
        ./wash_test3 || true
    
    - name: Install
      run: |
        cd build
        make install DESTDIR="$(cygpath -u "$GITHUB_WORKSPACE/install")"
    
    - name: Create package
      shell: pwsh
      run: |
        $ws = $env:GITHUB_WORKSPACE
        Push-Location "$ws/install"
        & "C:\Program Files\7-Zip\7z.exe" a -tzip "$ws/wash-mingw-x86_64.zip" .
        Pop-Location
        Push-Location "$ws/build/dist"
        & "C:\Program Files\7-Zip\7z.exe" a -tzip "$ws/wash-mingw-x86_64-dlls.zip" *.exe *.dll
        Pop-Location
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-mingw-x86_64
        path: wash-mingw-x86_64.zip
    
    - name: Upload DLLs
      uses: actions/upload-artifact@v4
      with:
        name: wash-mingw-x86_64-dlls
        path: wash-mingw-x86_64-dlls.zip

    - name: Package source code (wash + readline)
      run: |
        PKG=mingw-w64-x86_64-readline
        READLINE_VER=$(pacman -Q "$PKG" | awk '{print $2}' | cut -d. -f1-2)
        [ -n "$READLINE_VER" ] || READLINE_VER=8.3
        WORK=$(cygpath -u "$RUNNER_TEMP")/wash-src-pkg
        rm -rf "$WORK"
        mkdir -p "$WORK/readline" "$WORK/wash"
        curl -fsSL -o "$WORK/readline.tar.gz" "https://ftp.gnu.org/gnu/readline/readline-${READLINE_VER}.tar.gz" \
          || curl -fsSL -o "$WORK/readline.tar.gz" "https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz"
        tar -xzf "$WORK/readline.tar.gz" -C "$WORK/readline" --strip-components=1
        rm -f "$WORK/readline.tar.gz"
        cp -a "$(cygpath -u "$GITHUB_WORKSPACE")/." "$WORK/wash/"
        rm -rf "$WORK/wash/build" "$WORK/wash/.git"
        cd "$WORK"
        "/c/Program Files/7-Zip/7z.exe" a -tzip "$(cygpath -u "$GITHUB_WORKSPACE")/wash-mingw-x86_64-code.zip" .

    - name: Upload source code artifact
      uses: actions/upload-artifact@v4
      with:
        name: wash-mingw-x86_64-code
        path: wash-mingw-x86_64-code.zip

