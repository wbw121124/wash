  # 发布 Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-x86_64, build-msys2-mingw64, build-msys2-mingw32, build-msys2-ucrt64]
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/wash-linux-x86_64/*
          artifacts/wash-linux-x86_64-code/*
          artifacts/wash-mingw-x86_64/*
          artifacts/wash-mingw-x86_64-code/*
          artifacts/wash-mingw-i686/*
          artifacts/wash-mingw-i686-code/*
          artifacts/wash-ucrt-x86_64/*
          artifacts/wash-ucrt-x86_64-code/*
        generate_release_notes: true
        draft: false
        prerelease: false
